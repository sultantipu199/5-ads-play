[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnichannel-agency-engine"
version = "0.1.0"
description = "Omnichannel Autonomous Agency Engine for Meta, Google, LinkedIn, TikTok, and Snapchat"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agency Engineering Team" }]
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.1",
    "apscheduler>=3.10.4",
    "click>=8.1.7",
    "cryptography>=42.0.0",
    "greenlet>=3.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
agency = "agency_engine.cli:cli"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

